<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PalmerGuest kitchen card</title>
  <style>
    body { font-family: Georgia, serif; background: #efe8dc; margin: 0; padding: 32px; color: #241c14; }
    .card {
      width: 420px; background: #f7f3eb; border: 1px solid #d9d0c2; border-radius: 18px;
      padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .eyebrow { font-family: "Avenir Next", sans-serif; letter-spacing: .2em; text-transform: uppercase; font-size: 11px; color: #7c6234; margin: 0; }
    h1 { font-weight: 500; font-size: 32px; margin: 6px 0 12px; }
    p { font-family: "Avenir Next", sans-serif; font-size: 15px; line-height: 1.4; }
    .row { display: flex; justify-content: space-between; border-top: 1px solid #e4dccf; padding: 10px 0; font-family: "Avenir Next", sans-serif; }
    b { font-weight: 650; }
    @media print { body { background: white; } .card { box-shadow: none; } }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Palmer Home</p>
    <h1>Guest Wi-Fi</h1>
    <p>Join the network and open any page. The welcome screen will connect you.</p>
    <div class="row"><span>Network</span><b>PalmerGuest</b></div>
    <div class="row"><span>Access</span><b>1, 3, or 7 days</b></div>
  </div>
</body>
</html>
